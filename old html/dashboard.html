<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar With Bootstrap</title>
    <link href="https://cdn.lineicons.com/5.0/lineicons.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="wrapper">
      <aside id="sidebar">
        <div class="d-flex">
          <button class="toggle-btn" type="button">
            <img src="imgs/logo_white.png" alt="whiteLogo" class="menu-icon" />
          </button>
          <div class="sidebar-logo">
            <a href="#">! Hard Coders </a>
          </div>
        </div>
        <ul class="sidebar-nav">
          <li class="sidebar-item">
            <a href="dashboard.html" class="sidebar-link">
              <i class="lni lni-dashboard-square-1"></i>
              <span>DashBoard</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a href="courses.html" class="sidebar-link">
              <i class="lni lni-pen-to-square"></i>
              <span>Courses</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a
              href="#"
              class="sidebar-link collapsed has-dropdown"
              data-bs-toggle="collapse"
              data-bs-target="#courses1"
              aria-expanded="false"
              aria-controls="courses1"
            >
              <i class="lni lni-books-2"></i>
              <span>Projects</span>
            </a>
            <ul
              id="courses1"
              class="sidebar-dropdown list-unstyled collapse"
              data-bs-parent="#sidebar"
            >
              <li class="sidebar-item">
                <a href="projects.html" class="sidebar-link">Base</a>
              </li>
              <li class="sidebar-item">
                <a href="projects.html" class="sidebar-link">Community</a>
              </li>
            </ul>
          </li>
          <li class="sidebar-item">
            <a href="profile.html" class="sidebar-link">
              <i class="lni lni-user-4"></i>
              <span>Profile</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a href="community-upload.html" class="sidebar-link">
              <i class="lni lni-upload-1"></i>
              <span>Community Upload</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a href="collaborate.html" class="sidebar-link">
              <i class="lni lni-user-multiple-4"></i>
              <span>Collaborate</span>
            </a>
          </li>
        </ul>
        <div class="sidebar-footer">
          <a href="settings.html" class="sidebar-link">
            <i class="lni lni-gear-1"></i>
            <span>Settings</span>
          </a>
        </div>
        <div class="sidebar-footer">
          <a href="index.html" class="sidebar-link">
            <i class="lni lni-exit"></i> <span>Logout</span>
          </a>
        </div>
      </aside>
      <div class="main p-3">
        <div>
          <div class="title-container">
            <div>
              <h1>Welcome XXX</h1>
              <p>Here is your Profile Dashboard</p>
            </div>
            <div class="search">
              <form action="#">
                  <input type="text" placeholder="Search Courses"
                         name="search">
                  <button>
                    <i class="lni lni-search-1"></i>
                  </button>
              </form>
          </div>
          </div>
          <div class="grid-wrapper-four">
            <div class="box">
              <div class="grid-headers">
                <i class="lni lni-pen-to-square"></i>
                <span>Recent Projects</span>
              </div>

              <div class="image-container">
                <div class="image-item">
                  <img
                    src="imgs/placeholder-image.jpg"
                    alt="placeholder"
                    class="dashboard-imgs"
                  />
                  <p>Project 1</p>
                </div>
                <div class="image-item">
                  <img
                    src="imgs/placeholder-image.jpg"
                    alt="placeholder"
                    class="dashboard-imgs"
                  />
                  <p>Project 2</p>
                </div>
                <div class="image-item">
                  <img
                    src="imgs/placeholder-image.jpg"
                    alt="placeholder"
                    class="dashboard-imgs"
                  />
                  <p>Project 3</p>
                </div>
              </div>
            </div>
            <div class="box">
              <div class="grid-headers">
                <i class="lni lni-pen-to-square"></i>
                <span>Community</span>
              </div>
            </div>
            <div class="box">
              <div class="grid-headers">
                <i class="lni lni-pen-to-square"></i>
                <span>Daily Challenges</span>
              </div>
            </div>
            <div>
              <div class="dashboard-stats-wrapper">
                <div class="box a">
                  <div class="grid-headers">Projects done</div>
                </div>
                  <div class="box b">              
                  <div class="grid-headers">% average</div>
                </div>
                  <div class="box c">
                    <div class="grid-headers">Stats</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
      crossorigin="anonymous"
    ></script>
    <script src="js/script.js"></script>
  </body>
</html>
